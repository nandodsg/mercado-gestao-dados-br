# CI sem credencial de banco e sem chave nenhuma (por enquanto): confere o contrato de data/ e roda `dbt build` em DuckDB,
# tudo dentro do runner. O único secret que este repo vai ter é a chave do gateway de LLM da classificação (Item 7), com
# teto de gasto; ela entra aqui só quando o pipeline/ de classificação existir.
#
# data/ é escrito só pela publicação automática (1 commit por publicação, a partir do app privado), e esse commit dispara este
# workflow. Antes da 1ª publicação data/ não existe: o job roda sobre os dados fictícios de tests/fixtures, pra o
# esqueleto continuar testado.
#
# O gerador da página (`pipeline/gerar_site.py`) também roda aqui, num diretório temporário e sobre a mesma pasta de dados
# (fixture ou real): é o teste dele. Quem publica a página é o workflow `pages`, só sobre dado real.
#
# Depois do dbt build, sobre dado real, `analise/achados.py` refaz `analise/achados.md` (números saídos dos marts, texto do
# modelo `achados.modelo.md`) e o job commita o arquivo se mudou. É o único commit que este workflow faz, só na main e só
# em `analise/achados.md`; o GITHUB_TOKEN não dispara outro workflow, então não há laço.
name: pipeline

on:
  push:
    paths: ["data/**", "pipeline/**", "dbt/**", "tests/**", "analise/**", "site/**", "requirements.txt", ".github/workflows/pipeline.yml"]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # segunda 09h UTC, 3h depois do cron semanal de publicação
  workflow_dispatch:

permissions:
  contents: write # só pra commitar analise/achados.md na main (passo final); PR e fixture nunca commitam

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Escolher a pasta de dados
        id: dados
        run: |
          if [ -f data/manifest.json ] && [ -f data/rotulos.csv ] && head -1 data/rotulos.csv | grep -q ',ferramentas,' && [ -f data/empresas.csv ]; then
            echo "dir=data" >> "$GITHUB_OUTPUT"
            echo "Dados reais de data/"
          else
            echo "dir=tests/fixtures" >> "$GITHUB_OUTPUT"
            echo "::notice::data/ ainda não tem o contrato completo (rotulos.csv com a coluna ferramentas e empresas.csv chegam na próxima publicação): rodando sobre tests/fixtures (dados fictícios)"
          fi
      - name: Python compila
        run: python -m compileall -q pipeline
      - name: Contrato v1, manifest e sigilo
        env:
          DATA_DIR: ${{ steps.dados.outputs.dir }}
        run: python pipeline/check_data.py "$DATA_DIR"
      - name: dbt build (DuckDB, sem warehouse)
        env:
          DATA_DIR: ${{ steps.dados.outputs.dir }}
        run: |
          dbt build --project-dir dbt --profiles-dir dbt --vars "{data_dir: $DATA_DIR}"
      - name: Gerador da página roda (teste, num diretório temporário)
        env:
          DATA_DIR: ${{ steps.dados.outputs.dir }}
        run: |
          python pipeline/gerar_site.py "$RUNNER_TEMP/site" --dados "$DATA_DIR"
          test -s "$RUNNER_TEMP/site/index.html" && test -s "$RUNNER_TEMP/site/dados/pagina.json" && test -s "$RUNNER_TEMP/site/app.js"
      - name: Regerar analise/achados.md (só dado real)
        if: steps.dados.outputs.dir == 'data'
        run: python analise/achados.py
      - name: Commitar achados.md se mudou (só main)
        if: steps.dados.outputs.dir == 'data' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- analise/achados.md; then
            echo "achados.md já está em dia"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add analise/achados.md
            git commit -m "achados: regerado a partir da publicação de $(python -c "import json;print(json.load(open('data/manifest.json'))['gerado_em'][:10])")"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
