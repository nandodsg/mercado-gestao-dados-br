version: 2

models:
  - name: stg_vagas
    description: "Vagas publicadas (contrato v1). Fatos do posting e colunas derivadas da leitura da vaga (regime, cidade, contrato, salario_*)."
    columns:
      - name: id_publico
        description: "12 hex do sha256 da url normalizada (ou empresa|cargo quando a vaga não tem URL). Nunca um identificador interno do app de origem."
        data_tests: [not_null, unique]
      - name: empresa
        data_tests: [not_null]
      - name: cargo_oficial
        data_tests: [not_null]
      - name: modo
        description: "Recorte do dataset: vagas de liderança (único valor publicado)."
        data_tests:
          - accepted_values: {arguments: {values: ["lideranca"]}}
      - name: geografia
        data_tests:
          - accepted_values: {arguments: {values: ["br"]}}
      - name: regime
        description: "Derivado do posting. Cidade listada sem a palavra remoto = híbrido ou presencial."
        data_tests:
          - accepted_values:
              arguments: {values: ["presencial", "hibrido", "remoto"]}
              config: {severity: warn}
      - name: uf
        data_tests:
          - accepted_values:
              arguments:
                values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      - name: contrato
        description: "Normalizado no export (D17): CLT | PJ | vazio."
        data_tests:
          - accepted_values: {arguments: {values: ["CLT", "PJ"]}}
      - name: salario_tipo
        description: "Normalizado no export (D17): base | total | vazio."
        data_tests:
          - accepted_values: {arguments: {values: ["base", "total"]}}
      - name: data_publicacao
        description: "Dia em que o anúncio foi publicado, quando ele traz a data. Vazio = o anúncio não informa."
      - name: data_captura
        description: "Dia em que o autor encontrou o anúncio. Descreve a busca, não o anúncio."
        data_tests: [not_null]
      - name: data_analise
        description: "Dia da primeira leitura linha a linha do anúncio."
        data_tests: [not_null]
      - name: idioma
        description: "Idioma do anúncio."
        data_tests:
          - accepted_values:
              arguments: {values: ["pt", "en"]}
              config: {severity: warn}
      - name: tem_sobre_empresa
        description: "O anúncio tem a seção 'sobre a empresa'? Só sim ou não: o texto da seção não é publicado."
      - name: tem_beneficios
        description: "O anúncio lista benefícios? Só sim ou não: o texto da seção não é publicado."

  - name: stg_requisitos
    description: "Linhas de requisito dos postings, texto literal."
    columns:
      - name: id_publico
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_vagas'), field: id_publico}}
      - name: ordem
        data_tests: [not_null]
      - name: texto
        data_tests: [not_null]

  - name: stg_empresas
    description: "Empresa como aparece em vagas.csv, nome normalizado (grafias repetidas viram uma) e setor de atuação, da lista fechada `lista_setores`. Empresa sem linha aqui é aviso (teste empresa_sem_setor), não erro."
    columns:
      - name: empresa
        data_tests: [not_null, unique]
      - name: empresa_normalizada
        data_tests: [not_null]
      - name: setor
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('lista_setores'), field: setor}}

  - name: stg_benchmarks
    description: "Fontes de benchmark salarial por vaga. Referência pesquisada, nunca salário do posting."
    columns:
      - name: id_publico
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_vagas'), field: id_publico}}
      - name: fonte_url
        data_tests: [not_null]

  - name: mart_vagas
    description: "Vaga + bucket de nível (seed niveis, regra determinística), o sistema onde o anúncio está publicado (`ats`, lido da URL pelo seed ats_hosts) e o setor da empresa."
    columns:
      - name: id_publico
        data_tests: [not_null, unique]
      - name: nivel
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: ["coordenador", "gerente", "alta_gestao", "outros"]}}

  - name: stg_rotulos
    description: "Classificação de cada linha do anúncio na taxonomia (natureza + itens). Sem o texto da linha: só o hash dela e a posição."
    columns:
      - name: id_publico
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_vagas'), field: id_publico}}
      - name: ordem
        data_tests: [not_null]
      - name: hash_linha
        data_tests: [not_null]
      - name: secao
        data_tests:
          - accepted_values: {arguments: {values: ["responsabilidades", "requisitos", "diferenciais"]}}
      - name: natureza
        data_tests:
          - accepted_values: {arguments: {values: ["responsabilidade", "requisito", "contexto"]}}

  - name: stg_rotulo_itens
    description: "Linha rotulada × item (o campo itens aberto pelo separador). Todo item pertence ao vocabulário da taxonomia."
    columns:
      - name: item
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('taxonomia'), field: chave}}

  - name: stg_rotulo_ferramentas
    description: "Linha rotulada × ferramenta citada pelo nome (o campo ferramentas aberto pelo separador). Toda ferramenta pertence ao dicionário (seed ferramentas)."
    columns:
      - name: ferramenta
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('ferramentas'), field: ferramenta}}

  - name: stg_cobertura
    description: "Cobertura declarada no manifest: linhas de anúncio no universo × linhas rotuladas."

  - name: mart_vaga_item
    description: "Vaga × item da taxonomia (uma vaga conta uma vez por item). Base das contagens da análise."
    columns:
      - name: id_publico
        data_tests: [not_null]
      - name: item_chave
        data_tests: [not_null]
  - name: mart_vaga_ferramenta
    description: "Vaga × ferramenta citada pelo nome no anúncio (uma vaga conta uma vez por ferramenta), na mesma base de mart_vaga_item."
    columns:
      - name: id_publico
        data_tests: [not_null]
      - name: ferramenta
        data_tests: [not_null]
  - name: mart_repost
    description: "Anúncio repetido (mesma empresa, mesmo nível, mesmo conjunto de linhas): aponta pro original e sai de mart_vaga_item."
    columns:
      - name: id_publico
        data_tests: [not_null, unique]
      - name: repost_de
        data_tests: [not_null]
  - name: mart_cobertura_rotulos
    description: "Fração do universo de anúncios já classificada. Parcial é estado normal durante uma rodada."

  - name: mart_resumo_nivel
    description: "Contagem de vagas por nível."

seeds:
  - name: taxonomia
    description: "Itens da taxonomia de requisitos, gerados de rotulagem/taxonomia.md por rotulagem/gerar_seeds.py. Não editar à mão."
    columns:
      - name: chave
        data_tests: [not_null, unique]
      - name: dimensao
        data_tests: [not_null]
  - name: lista_setores
    description: "Lista fechada de setores de atuação da empresa. Única fonte da lista: empresas.csv, o rótulo de setor das linhas do anúncio e o prompt da rotulagem leem daqui."
    columns:
      - name: setor
        data_tests: [not_null, unique]
  - name: ferramentas
    description: "Dicionário de ferramentas: regex (sobre o texto sem acento e em minúsculas) por nome canônico. `remover` é apagado do texto antes de casar."
    columns:
      - name: ordem
        data_tests: [not_null, unique]
      - name: ferramenta
        data_tests: [not_null]
      - name: padrao
        data_tests: [not_null]
  - name: niveis
    description: "Regra título → bucket de nível (coordenador, gerente, alta_gestao, outros). Seed público, escrito pra leitor externo."
    columns:
      - name: ordem
        data_tests: [not_null, unique]
      - name: padrao
        data_tests: [not_null]
      - name: bucket
        data_tests:
          - accepted_values: {arguments: {values: ["coordenador", "gerente", "alta_gestao", "outros"]}}
  - name: ats_hosts
    description: "Endereço (final do host da URL do anúncio) → sistema onde o anúncio está publicado (ATS ou portal). Lido da URL, que já é pública; vale o padrão mais longo. Endereço fora da lista = página de carreiras da própria empresa."
    columns:
      - name: host
        data_tests: [not_null, unique]
      - name: ats
        data_tests: [not_null]
